[package]
name = "zones-cxxqt-evaluation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cxx = "1.0.176"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
serde_json = "1.0"
notify = "=8.2.0"
toml = { version = "=1.1.6", default-features = false, features = ["parse", "std", "serde"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"

[profile.release]
debug = 0
strip = "debuginfo"

name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qml-and-models:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install test tools
        run: pacman -Syu --noconfirm --needed git nodejs python lua qt6-declarative quickshell
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check models and native file storage
        run: |
          node tests/model_test.mjs
          python tests/store_test.py
      - name: Parse QML and Lua
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          manifest = json.loads(Path("manifest.json").read_text())
          runtime = Path(manifest["entryPoints"]["service"]).parent
          for path in runtime.glob("*.qml"):
              subprocess.run(["/usr/lib/qt6/bin/qmlformat", str(path)], check=True, stdout=subprocess.DEVNULL)
          PY
          node tests/runtime_test.mjs

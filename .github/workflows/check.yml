name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor-and-core:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git cmake gcc make pkgconf qt6-base tomlplusplus python ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build editor and core checks
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOMARCHY_ZONES_BUILD_PLUGIN=OFF && cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure && python tests/manage_test.py && python tests/packaging_test.py
